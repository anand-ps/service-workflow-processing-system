<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Local Service Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand">
                <span class="brand-icon">🔧</span>
                <span>LocalServe</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="btn btn-outline btn-sm">Home</a>
                <a href="register.html" class="btn btn-primary btn-sm">Register</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="auth-box">
            <h2>Welcome Back</h2>
            <p class="subtitle">Log in to manage bookings or service requests</p>

            <div id="alert-box" class="alert"></div>

            <form onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">Sign In</button>
            </form>

            <div style="margin-top: 24px; text-align: center; font-size: 0.9rem;">
                Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Register here</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>

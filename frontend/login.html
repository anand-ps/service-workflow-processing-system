<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Local Service Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand">
                <span class="brand-icon">🔧</span>
                <span>LocalServe</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="btn btn-outline btn-sm">Home</a>
                <a href="register.html" class="btn btn-primary btn-sm">Register</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="auth-box">
            <h2>Welcome Back</h2>
            <p class="subtitle">Log in to manage bookings or service requests</p>

            <div id="alert-box" class="alert"></div>

            <form onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">Sign In</button>
            </form>

            <div style="margin-top: 24px; text-align: center; font-size: 0.9rem;">
                Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Register here</a>
            </div>

            <!-- Quick Demo Credentials Box for Evaluator/Viva -->
            <div style="margin-top: 25px; padding: 12px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 6px; font-size: 0.8rem;">
                <p style="font-weight: bold; margin-bottom: 6px; color: #475569;">Quick Demo Credentials:</p>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <div><button type="button" onclick="fillCreds('admin@services.com', 'admin123')" class="btn btn-outline btn-sm" style="padding: 2px 6px; font-size: 0.75rem;">Admin</button> admin@services.com / admin123</div>
                    <div><button type="button" onclick="fillCreds('rahul@gmail.com', 'user123')" class="btn btn-outline btn-sm" style="padding: 2px 6px; font-size: 0.75rem;">Customer</button> rahul@gmail.com / user123</div>
                    <div><button type="button" onclick="fillCreds('rajesh@electrician.com', 'provider123')" class="btn btn-outline btn-sm" style="padding: 2px 6px; font-size: 0.75rem;">Provider</button> rajesh@electrician.com / provider123</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function fillCreds(email, pass) {
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = pass;
        }
    </script>
</body>
</html>
